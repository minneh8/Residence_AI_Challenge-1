<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUAT - Análise de Notícias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <img src="DUAT.png" alt="Logo DUAT" class="logo">
      <h1>DUAT</h1>
      <p>Analise características textuais de uma notícia.</p>
    </header>

    <form id="news-form">
      <label for="news-text">Texto da notícia</label>
      <textarea id="news-text" name="news-text" rows="14" minlength="20" required placeholder="Cole aqui o texto completo da notícia..."></textarea>

      <label for="pipeline-select">Pipeline</label>
      <select id="pipeline-select" name="pipeline">
        <option value="svm">SVM — classificação</option>
        <option value="kmeans">K-Means — clusterização</option>
        <option value="dbscan">DBSCAN — anomalias</option>
        <option value="isolation_forest">Isolation Forest — anomalias</option>
      </select>

      <button id="analyze-button" type="submit">Analisar notícia</button>
    </form>

    <p id="model-status" class="model-status">Verificando pipelines...</p>
    <p id="status" class="status" aria-live="polite"></p>

    <section id="result" class="result hidden" aria-live="polite">
      <h2 id="classification"></h2>
      <p>Probabilidade falsa: <strong id="fake-probability">Indisponível</strong></p>
      <p>Probabilidade verdadeira: <strong id="true-probability">Indisponível</strong></p>
      <p>Confiança/score: <strong id="confidence">Indisponível</strong></p>
      <h3>Detalhes</h3>
      <ul id="explanation"></ul>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
